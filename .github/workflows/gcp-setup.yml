# ==============================================================================
# GCP Setup - pf-rates
# ==============================================================================
#
# One-time setup workflow to create required GCP resources:
#   - Artifact Registry repository
#   - Secret Manager secrets (PF_DATABASE_URL, PF_RATES_API_KEY)
#   - Service Account IAM permissions
#
# USAGE:
#   1. Ensure GitHub Secrets are configured: GCP_SA_KEY, GCP_PROJECT_ID
#   2. Run this workflow manually from GitHub Actions UI
#   3. Choose what to create (secrets, artifact registry, or both)
#
# Run this ONCE before the first deployment.
#
# ==============================================================================

name: GCP Setup - pf-rates

on:
  workflow_dispatch:
    inputs:
      create_secrets:
        description: 'Create Secret Manager secrets (placeholder values)'
        required: true
        type: boolean
        default: true
      create_artifact_registry:
        description: 'Create Artifact Registry repository'
        required: true
        type: boolean
        default: true

jobs:
  setup:
    uses: mrturo-pf/pf-common/.github/workflows/gcp-setup-reusable.yml@main
    with:
      service_name: pf-rates
      create_secrets: ${{ inputs.create_secrets }}
      create_artifact_registry: ${{ inputs.create_artifact_registry }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
